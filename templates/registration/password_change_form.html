{% extends 'base.html' %}
{% block title %}Change password{% endblock %}
{% block body %}
<div style="min-height:100vh;display:grid;place-items:center;padding:24px">
  <form method="post" class="form-card" style="max-width:440px;width:100%" novalidate>
    {% csrf_token %}
    <section class="form-section">
      <div class="form-section-head"><h2>Change password</h2><p>Use at least 8 characters that aren't easy to guess.</p></div>
      <div class="fields one">
        {% for f in form %}
        <div class="field">
          <label for="{{ f.id_for_label }}">{{ f.label }}</label>
          <input class="input" type="password" name="{{ f.html_name }}" id="{{ f.id_for_label }}" autocomplete="{% if forloop.first %}current-password{% else %}new-password{% endif %}" required{% if f.errors %} aria-invalid="true"{% endif %}>
          {% if f.errors %}<p class="error-text">{{ f.errors|join:' ' }}</p>{% endif %}
        </div>
        {% endfor %}
      </div>
    </section>
    <div class="form-actions"><a class="btn btn-secondary" href="{% url 'fleet:settings' %}">Cancel</a><button class="btn btn-primary" type="submit">Change password</button></div>
  </form>
</div>
{% endblock %}
